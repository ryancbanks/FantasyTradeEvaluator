name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.13"
          architecture: x64
          cache: pip
      - name: Verify dependency lock and canonical build export
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.26"
          uv lock --check
          uv export --locked --extra build --no-dev --no-emit-project \
            --no-header --no-annotate --format requirements.txt \
            --output-file "$RUNNER_TEMP/build-requirements.txt"
          diff -u packaging/build-requirements.txt \
            "$RUNNER_TEMP/build-requirements.txt"
      - name: Install source-test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: --requirement packaging/build-requirements.txt
          python -m pip install --disable-pip-version-check ".[browser-test]"
      - name: Install source-test Chromium and Linux libraries
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"
        run: python -m playwright install --with-deps --no-shell chromium
      - name: Run test suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m unittest discover -s tests -v
      - name: Smoke installed wheel outside the checkout
        run: python packaging/smoke_wheel.py

  release:
    name: ${{ matrix.name }}
    needs: verify
    environment: ${{ github.event_name == 'push' && 'release' || 'build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            python_arch: x64
            installer: windows
          - name: macOS Intel
            runner: macos-15-intel
            python_arch: x64
            installer: macos
          - name: macOS Apple silicon
            runner: macos-15
            python_arch: arm64
            installer: macos
          - name: Linux x64
            runner: ubuntu-22.04
            python_arch: x64
            installer: linux
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            python_arch: arm64
            installer: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.13"
          architecture: ${{ matrix.python_arch }}
          cache: pip
      - name: Verify release tag matches project version
        if: github.ref_type == 'tag'
        shell: python
        run: |
          import os
          import release_build
          release_build.validate_release_tag(os.environ["GITHUB_REF_NAME"])
      - name: Install hash-locked native build dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: --requirement packaging/build-requirements.txt
      - name: Install Inno Setup
        if: matrix.installer == 'windows'
        shell: pwsh
        run: |
          $uri = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw 'Inno Setup SHA-256 verification failed'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -ne 'CN=Pyrsys B.V., O=Pyrsys B.V., S=Noord-Holland, C=NL' -or
              $signature.SignerCertificate.Thumbprint -ne 'E0AB19C8D38CBF9C44709925122A7A02F8C70CB7') {
            throw 'Inno Setup Authenticode verification failed'
          }
          $process = Start-Process -FilePath $installer -WindowStyle Hidden -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER'
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Configure macOS signing and notarization
        if: >-
          matrix.installer == 'macos' &&
          github.event_name == 'push' &&
          github.ref_type == 'tag'
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          required=(MACOS_SIGN_IDENTITY MACOS_CERTIFICATE_BASE64 \
            MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD)
          configured=0
          for name in "${required[@]}"; do
            if [ -n "${!name:-}" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "No Apple credentials configured; building an unsigned development DMG."
            exit 0
          fi
          if [ "$configured" -ne "${#required[@]}" ]; then
            echo "macOS signing secrets must be configured as a complete set." >&2
            exit 2
          fi
          keychain="$RUNNER_TEMP/fte-signing.keychain-db"
          certificate="$RUNNER_TEMP/fte-signing.p12"
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          identities=$(security find-identity -v -p codesigning "$keychain")
          printf '%s\n' "$identities"
          if ! grep -F -- "$MACOS_SIGN_IDENTITY" <<< "$identities"; then
            echo "Configured macOS signing identity was not imported." >&2
            exit 2
          fi
          xcrun notarytool store-credentials fantasy-trade-evaluator-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          rm -f "$certificate"
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_PROFILE=fantasy-trade-evaluator-notary" >> "$GITHUB_ENV"
      - name: Build native release
        run: python release_build.py
      - name: Smoke finished installer or disk image
        run: python packaging/smoke_native_release.py release
      - name: Remove temporary macOS signing keychain
        if: always() && matrix.installer == 'macos'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/fte-signing.keychain-db"
          rm -f "$RUNNER_TEMP/fte-signing.p12"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fantasy-trade-evaluator-${{ matrix.installer }}-${{ matrix.python_arch }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download verified platform artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: fantasy-trade-evaluator-*
          path: downloaded
      - name: Verify and assemble the exact release set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python release_assemble.py downloaded publish --version "$version"
      - name: Create or resume the commit-matched draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker="Automated release draft for commit $GITHUB_SHA."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
            if [ "$is_draft" != "true" ] || [ "$body" != "$marker" ]; then
              echo "Refusing to replace an existing release or unrelated draft." >&2
              exit 2
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --notes "$marker" \
              --title "Fantasy Trade Evaluator $GITHUB_REF_NAME"
          fi
      - name: Upload and verify the complete remote asset inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" publish/* --clobber
          gh release view "$GITHUB_REF_NAME" --json assets \
            > "$RUNNER_TEMP/release-assets.json"
          python release_inventory.py publish "$RUNNER_TEMP/release-assets.json"
      - name: Publish completed GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
